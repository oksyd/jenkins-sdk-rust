name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'Dockerfile'
      - 'CHANGELOG.md'
      - 'README.md'
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jenkins-lts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.148
      - uses: Swatinem/rust-cache@v2
      - name: Test against Jenkins 2.580.1 LTS
        run: tests/jenkins-lts.sh

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --features blocking-rustls-ring,compression-gzip -- -D warnings

      - name: Doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --features blocking-rustls-ring

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: async-rustls-ring
            args: --no-default-features --features async-rustls-ring
          - name: async-rustls-aws-lc-rs
            args: --no-default-features --features async-rustls-aws-lc-rs
          - name: async-native-tls
            args: --no-default-features --features async-native-tls
          - name: blocking-rustls-ring
            args: --no-default-features --features blocking-rustls-ring
          - name: blocking-rustls-aws-lc-rs
            args: --no-default-features --features blocking-rustls-aws-lc-rs
          - name: async-and-blocking
            args: --features blocking-rustls-ring,compression-gzip,compression-brotli,compression-zstd
          - name: blocking-native-tls
            args: --no-default-features --features blocking-native-tls

    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.148

      - name: Install OpenSSL (native-tls)
        if: contains(matrix.name, 'native-tls')
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Ensure blocking has no tokio dependency
        if: startsWith(matrix.name, 'blocking')
        run: |
          if cargo tree -e normal ${{ matrix.args }} -i tokio | grep -q "tokio v"; then
            echo "tokio is a normal dependency under blocking"
            exit 1
          fi

      - name: Test (${{ matrix.name }})
        run: cargo nextest run --workspace ${{ matrix.args }}

      - name: Doctests (${{ matrix.name }})
        run: cargo test --workspace --doc ${{ matrix.args }}
